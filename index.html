<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kingston Keilim Mikvah</title>
<meta name="description" content="Kingston Keilim Mikvah — Kingston, PA. Details coming soon. Questions: info@kingstonkeilim.org">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f2a44'/%3E%3Cpath d='M14 38c6-7 10 7 16 0s10 7 16 0' fill='none' stroke='%238fc3dd' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M14 48c6-7 10 7 16 0s10 7 16 0' fill='none' stroke='%23ffffff' stroke-width='4' stroke-linecap='round' opacity='.85'/%3E%3C/svg%3E">
<style>
  :root {
    --navy: #0f2a44;
    --navy-soft: #1c3d5e;
    --water: #5b8fb3;
    --water-light: #dbeef5;
    --ink: #1e2e3d;
    --muted: #4a5a6a;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: #ffffff;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 18px;
    line-height: 1.65;
    text-align: center;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 72px 24px 48px;
  }
  .hebrew {
    margin: 0 0 28px;
    color: var(--navy);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 22px;
    letter-spacing: 0.02em;
  }
  h1 {
    margin: 0;
    color: var(--navy);
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(2.1rem, 9vw, 3.4rem);
    font-weight: 400;
    line-height: 1.15;
    letter-spacing: 0.01em;
  }
  .rule {
    width: 56px;
    height: 2px;
    margin: 32px auto;
    background: var(--water);
    border: 0;
  }
  .wave { display: block; width: 180px; height: 28px; margin: 8px auto 32px; color: var(--water); }
  .wave path { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  p { margin: 0 0 20px; }
  .coming {
    color: var(--navy-soft);
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(1.25rem, 5.5vw, 1.6rem);
    line-height: 1.4;
  }
  .contact { color: var(--muted); font-size: 17px; }
  a { color: var(--navy); text-decoration: underline; text-underline-offset: 3px; }
  a:hover, a:focus-visible { color: #083a5e; }
  a:focus-visible { outline: 3px solid var(--water); outline-offset: 3px; }
  footer {
    margin-top: 72px;
    padding-top: 24px;
    border-top: 1px solid var(--water-light);
    color: var(--muted);
    font-size: 16px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  @media (max-width: 400px) {
    main { padding: 56px 20px 40px; }
    body { font-size: 17px; }
    .hebrew { font-size: 20px; }
    footer { margin-top: 56px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>
</head>
<body>
<main>
  <p class="hebrew" lang="he" dir="rtl">מקוה כלים</p>
  <h1>Kingston Keilim Mikvah</h1>
  <hr class="rule" aria-hidden="true">
  <svg class="wave" viewBox="0 0 180 28" aria-hidden="true" focusable="false"><path d="M2 10 C 17 2, 32 18, 47 10 S 77 2, 92 10 S 122 18, 137 10 S 167 2, 178 10" /><path d="M2 22 C 17 14, 32 28, 47 22 S 77 14, 92 22 S 122 28, 137 22 S 167 14, 178 22" opacity="0.55" /></svg>
  <p class="coming">Details coming soon</p>
  <p class="contact">Questions: <a href="mailto:info@kingstonkeilim.org">info@kingstonkeilim.org</a></p>
  <footer>Kingston, PA</footer>
</main>
</body>
</html>
